name: Android CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      # NDK is not required: :decoder-ffmpeg ships prebuilt libffmpegJNI.so.
      # Rebuild natives locally with ./decoder-ffmpeg/rebuild-native.sh (NDK r26b + FFmpeg 6.0).
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
